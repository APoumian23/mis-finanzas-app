# nginx para finanzas.ejemplo.com: la app (estática) y su API en /api (Node en 127.0.0.1:3260, con PM2)
#
#   sudo cp despliegue/nginx-finanzas.conf /etc/nginx/sites-available/finanzas
#   sudo ln -s /etc/nginx/sites-available/finanzas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d finanzas.ejemplo.com   (ya aplicado: lo de "managed by Certbot" lo escribió certbot)

server {
    server_name finanzas.ejemplo.com;
    root /var/www/finanzas;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Comprimir: el JS de la app baja en ~255 KB en vez de 856 KB (un acceso directo nuevo en el iPhone lo baja todo de cero)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # El service worker y el HTML no se guardan en caché: así la app se actualiza sola
    location = /sw.js { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

    # Archivos con huella en el nombre: caché de un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        types { application/javascript js mjs; text/css css; }
    }

    # API: entrar y sincronizar. La primera sincronización sube todo (unos cientos de KB)
    location /api/ {
        proxy_pass http://127.0.0.1:3260;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/finanzas.ejemplo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/finanzas.ejemplo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = finanzas.ejemplo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name finanzas.ejemplo.com;
    return 404; # managed by Certbot


}